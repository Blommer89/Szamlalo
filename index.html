    /* ============================================================
       CÉLOK
       ============================================================ */

    function modositMaiCelt(id) {

        const data =
            loadData();

        const g =
            gyakorlatokDef.find(
                x => x.id === id
            );

        if (!g) {
            return;
        }


        const today =
            getTodayString();

        const current =
            getGoal(
                data,
                id,
                today
            );


        const value =
            prompt(
                `Mai cél – ${g.name}\n\n` +
                `Jelenlegi cél: ` +
                formatGoal(
                    current,
                    g.type
                ) +
                `\n\n` +
                `Add meg az új célt:`,
                String(current)
            );


        if (
            value === null
        ) {

            return;

        }


        const newGoal =
            Number(value);


        if (
            !Number.isFinite(newGoal) ||
            newGoal <= 0
        ) {

            alert(
                'Érvényes, nullánál nagyobb számot adj meg.'
            );

            return;

        }


        data.goals[
            id + '_' + today
        ] = newGoal;

        saveData(data);

        renderApp();
    }


    function mentiCelt(
        id,
        input
    ) {

        const value =
            Number(
                input.value
            );


        if (
            !Number.isFinite(value) ||
            value <= 0
        ) {

            return;

        }


        const data =
            loadData();

        const today =
            getTodayString();


        data.goals[
            id + '_' + today
        ] = value;


        saveData(data);

        renderApp();
    }


    /* ============================================================
       HOZZÁADÁS
       ============================================================ */

    function hozzaad(
        id,
        amount
    ) {

        amount =
            Number(amount);


        if (
            !Number.isFinite(amount) ||
            amount <= 0
        ) {

            return;

        }


        const data =
            loadData();

        const today =
            getTodayString();

        const history =
            getHistory(
                data,
                id
            );

        const regiErtek =
            Number(
                history[today]
            ) || 0;

        const ujErtek =
            regiErtek + amount;


        history[today] =
            ujErtek;


        saveData(data);


        utolsoMuvelet = {

            id,
            amount,
            previousValue:
                regiErtek,

            newValue:
                ujErtek,

            date:
                today

        };


        const cel =
            getGoal(
                data,
                id,
                today
            );


        if (
            regiErtek < cel &&
            ujErtek >= cel
        ) {

            mutatPopup();

        }


        renderApp();
    }


    function egyediHozzaad(id) {

        const input =
            document.getElementById(
                'custom_' + id
            );


        if (!input) {
            return;
        }


        const value =
            Number(
                input.value
            );


        if (
            !Number.isFinite(value) ||
            value <= 0
        ) {

            return;

        }


        hozzaad(
            id,
            value
        );


        input.value =
            '';
    }


    function visszavon() {

        if (
            !utolsoMuvelet
        ) {

            return;

        }


        const data =
            loadData();

        const operation =
            utolsoMuvelet;


        if (
            operation.date !==
            getTodayString()
        ) {

            utolsoMuvelet =
                null;

            renderApp();

            return;

        }


        const history =
            getHistory(
                data,
                operation.id
            );


        const current =
            Number(
                history[operation.date]
            ) || 0;


        if (
            current !==
            operation.newValue
        ) {

            utolsoMuvelet =
                null;

            renderApp();

            return;

        }


        history[operation.date] =
            Math.max(
                0,
                operation.previousValue
            );


        saveData(data);

        utolsoMuvelet =
            null;

        renderApp();
    }


    /* ============================================================
       STOPPER
       ============================================================ */

    function getTimerElapsed(
        data,
        id
    ) {

        const timer =
            data.timers[id];


        if (!timer) {
            return 0;
        }


        let elapsed =
            Number(
                timer.elapsed
            ) || 0;


        if (
            timer.running === true &&
            Number(timer.startedAt) > 0
        ) {

            elapsed +=
                (
                    Date.now() -
                    Number(timer.startedAt)
                ) / 1000;

        }


        return Math.max(
            0,
            Math.floor(elapsed)
        );
    }


    function formatStopwatchTime(
        seconds
    ) {

        seconds =
            Math.max(
                0,
                Math.floor(
                    Number(seconds) || 0
                )
            );


        const hours =
            Math.floor(
                seconds / 3600
            );


        const minutes =
            Math.floor(
                (seconds % 3600) / 60
            );


        const secs =
            seconds % 60;


        return [

            String(hours)
                .padStart(2, '0'),

            String(minutes)
                .padStart(2, '0'),

            String(secs)
                .padStart(2, '0')

        ].join(':');
    }


    function stopperIndit(id) {

        const data =
            loadData();


        if (!data.timers) {

            data.timers =
                {};

        }


        const timer =
            data.timers[id] || {

                elapsed:
                    0,

                startedAt:
                    0,

                running:
                    false

            };


        if (
            timer.running
        ) {

            return;

        }


        timer.startedAt =
            Date.now();

        timer.running =
            true;


        data.timers[id] =
            timer;


        saveData(data);

        startStopperFrissites();

        renderApp();
    }


    function stopperSzünet(id) {

        const data =
            loadData();


        if (
            !data.timers ||
            !data.timers[id]
        ) {

            return;

        }


        const timer =
            data.timers[id];


        if (
            !timer.running
        ) {

            return;

        }


        timer.elapsed =
            getTimerElapsed(
                data,
                id
            );

        timer.startedAt =
            0;

        timer.running =
            false;


        data.timers[id] =
            timer;


        saveData(data);


        /*
         * Csak akkor állítjuk le a frissítést,
         * ha már egyetlen stopper sem fut.
         */

        if (
            !vanFutoStopper(data)
        ) {

            stopStopperFrissites();

        }


        renderApp();
    }


    function stopperNullaz(id) {

        const data =
            loadData();


        if (!data.timers) {

            data.timers =
                {};

        }


        data.timers[id] = {

            elapsed:
                0,

            startedAt:
                0,

            running:
                false

        };


        saveData(data);


        if (
            !vanFutoStopper(data)
        ) {

            stopStopperFrissites();

        }


        renderApp();
    }


    function stopperBefejez(id) {

        const data =
            loadData();


        if (
            !data.timers ||
            !data.timers[id]
        ) {

            return;

        }


        const elapsed =
            getTimerElapsed(
                data,
                id
            );


        if (
            elapsed <= 0
        ) {

            alert(
                'A stopper még nem mért időt.'
            );

            return;

        }


        const today =
            getTodayString();


        const history =
            getHistory(
                data,
                id
            );


        const regiErtek =
            Number(
                history[today]
            ) || 0;


        const ujErtek =
            regiErtek + elapsed;


        history[today] =
            ujErtek;


        /*
         * A stopper nullázódik,
         * miután az időt hozzáadtuk
         * a napi eredményhez.
         */

        data.timers[id] = {

            elapsed:
                0,

            startedAt:
                0,

            running:
                false

        };


        const cel =
            getGoal(
                data,
                id,
                today
            );


        saveData(data);


        utolsoMuvelet = {

            id,

            amount:
                elapsed,

            previousValue:
                regiErtek,

            newValue:
                ujErtek,

            date:
                today

        };


        /*
         * Ha több stopper fut,
         * a másik továbbra is fusson.
         */

        if (
            !vanFutoStopper(data)
        ) {

            stopStopperFrissites();

        }


        if (
            regiErtek < cel &&
            ujErtek >= cel
        ) {

            mutatPopup();

        }


        renderApp();
    }


    function vanFutoStopper(data) {

        if (
            !data.timers
        ) {

            return false;

        }


        return Object.values(
            data.timers
        ).some(
            timer =>
                timer &&
                timer.running === true
        );
    }


    function startStopperFrissites() {

        if (
            stopperInterval !== null
        ) {

            return;

        }


        stopperInterval =
            setInterval(
                frissitStopperKijelzok,
                250
            );


        frissitStopperKijelzok();
    }


    function stopStopperFrissites() {

        if (
            stopperInterval !== null
        ) {

            clearInterval(
                stopperInterval
            );

            stopperInterval =
                null;
        }
    }


    function frissitStopperKijelzok() {

        const data =
            loadData();


        if (
            !vanFutoStopper(data)
        ) {

            stopStopperFrissites();

            return;

        }


        gyakorlatokDef.forEach(
            g => {

                if (
                    g.type !== 'sec'
                ) {

                    return;

                }


                const display =
                    document.getElementById(
                        'stopwatch_display_' +
                        g.id
                    );


                if (!display) {

                    return;

                }


                const elapsed =
                    getTimerElapsed(
                        data,
                        g.id
                    );


                display.innerText =
                    formatStopwatchTime(
                        elapsed
                    );

            }
        );
    }


    /* ============================================================
       STATISZTIKÁK
       ============================================================ */

    function calculateWeeklyTotal(
        data,
        id
    ) {

        let total = 0;

        const today =
            dateFromString(
                getTodayString()
            );


        for (
            let i = 0;
            i < 7;
            i++
        ) {

            const date =
                new Date(today);

            date.setDate(
                date.getDate() - i
            );


            const key =
                dateToString(date);


            total +=
                Number(
                    getHistory(
                        data,
                        id
                    )[key]
                ) || 0;

        }


        return total;
    }


    function calculateRecord(
        data,
        id
    ) {

        const history =
            getHistory(
                data,
                id
            );


        const values =
            Object.values(
                history
            ).map(
                Number
            );


        if (
            values.length === 0
        ) {

            return 0;

        }


        return Math.max(
            ...values,
            0
        );
    }


    function calculateAverage(
        data,
        id
    ) {

        const history =
            getHistory(
                data,
                id
            );


        const values =
            Object.values(
                history
            )
            .map(Number)
            .filter(
                value =>
                    value > 0
            );


        if (
            values.length === 0
        ) {

            return 0;

        }


        return (
            values.reduce(
                (a, b) =>
                    a + b,
                0
            ) /
            values.length
        );
    }


    function calculateStreak(
        data
    ) {

        let streak =
            0;

        const date =
            dateFromString(
                getTodayString()
            );


        while (true) {

            const dateString =
                dateToString(date);


            let complete = true;


            getActiveExercises(data)
                .forEach(g => {

                    const value =
                        getHistory(
                            data,
                            g.id
                        )[dateString] || 0;


                    const goal =
                        getGoal(
                            data,
                            g.id,
                            dateString
                        );


                    if (
                        Number(value) <
                        Number(goal)
                    ) {

                        complete =
                            false;

                    }

                });


            if (!complete) {

                break;

            }


            streak++;

            date.setDate(
                date.getDate() - 1
            );


            if (
                streak > 3650
            ) {

                break;

            }

        }


        return streak;
    }


    /* ============================================================
       NAPI ÖSSZESÍTŐ
       ============================================================ */

    function renderDailySummary() {

        const data =
            loadData();

        const active =
            getActiveExercises(data);

        const today =
            getTodayString();


        let completed =
            0;


        active.forEach(g => {

            const value =
                getTodayValue(
                    data,
                    g.id
                );

            const goal =
                getGoal(
                    data,
                    g.id,
                    today
                );


            if (
                value >= goal
            ) {

                completed++;

            }

        });


        const streak =
            calculateStreak(
                data
            );


        const summary =
            document.getElementById(
                'daily-summary'
            );


        summary.innerHTML = `

            <h3 class="section-title">
                📅 Mai összesítés
            </h3>

            <div class="stats-grid">

                <div class="stat">

                    <span class="stat-value">
                        ${completed}/${active.length}
                    </span>

                    <span class="stat-label">
                        teljesített cél
                    </span>

                </div>


                <div class="stat">

                    <span class="stat-value">
                        ${streak} 🔥
                    </span>

                    <span class="stat-label">
                        napos sorozat
                    </span>

                </div>

            </div>

        `;
    }


    /* ============================================================
       FŐ RENDER
       ============================================================ */

    function renderApp() {

        const data =
            loadData();

        const today =
            getTodayString();

        const active =
            getActiveExercises(data);


        renderDailySummary();


        const list =
            document.getElementById(
                'exercise-list'
            );


        if (
            active.length === 0
        ) {

            list.innerHTML = `

                <div class="card">

                    <div class="empty">

                        Nincs kiválasztott gyakorlat.

                        <br>

                        Válassz legalább egyet
                        a fenti listából.

                    </div>

                </div>

            `;

            return;

        }


        list.innerHTML =
            active.map(g => {

                const id =
                    g.id;


                const value =
                    getTodayValue(
                        data,
                        id
                    );


                const goal =
                    getGoal(
                        data,
                        id,
                        today
                    );


                const percent =
                    goal > 0
                        ? clamp(
                            (value / goal) * 100,
                            0,
                            100
                        )
                        : 0;


                const history =
                    getHistory(
                        data,
                        id
                    );


                const recentDates =
                    Object.keys(history)
                        .filter(
                            date =>
                                Number(
                                    history[date]
                                ) > 0
                        )
                        .sort()
                        .reverse()
                        .slice(0, 5);


                const recentHtml =
                    recentDates.length
                        ? recentDates.map(
                            date => `

                                <div class="history-row">

                                    <span>
                                        ${formatDate(date)}
                                    </span>

                                    <strong>
                                        ${formatValue(
                                            history[date],
                                            g.type
                                        )}
                                    </strong>

                                </div>

                            `
                        ).join('')
                        : `
                            <div class="empty">
                                Még nincs előzmény.
                            </div>
                        `;


                /* ------------------------------------------------
                   NORMÁL HOZZÁADÓ GOMBOK
                   ------------------------------------------------ */

                let buttonsHtml = '';


                if (
                    g.type === 'sec'
                ) {

                    buttonsHtml = `

                        <div class="btn-group">

                            <button
                                class="btn-plus"
                                style="
                                    background:${g.color};
                                "
                                onclick="
                                    hozzaad(
                                        '${id}',
                                        30
                                    )
                                "
                            >
                                +30 mp
                            </button>


                            <button
                                class="btn-plus"
                                style="
                                    background:${g.color};
                                "
                                onclick="
                                    hozzaad(
                                        '${id}',
                                        60
                                    )
                                "
                            >
                                +1 perc
                            </button>


                            <button
                                class="btn-plus"
                                style="
                                    background:${g.color};
                                "
                                onclick="
                                    hozzaad(
                                        '${id}',
                                        300
                                    )
                                "
                            >
                                +5 perc
                            </button>

                        </div>

                    `;

                } else {

                    buttonsHtml = `

                        <div class="btn-group">

                            <button
                                class="btn-plus"
                                style="
                                    background:${g.color};
                                "
                                onclick="
                                    hozzaad(
                                        '${id}',
                                        10
                                    )
                                "
                            >
                                +10
                            </button>


                            <button
                                class="btn-plus"
                                style="
                                    background:${g.color};
                                "
                                onclick="
                                    hozzaad(
                                        '${id}',
                                        20
                                    )
                                "
                            >
                                +20
                            </button>


                            <button
                                class="btn-plus"
                                style="
                                    background:${g.color};
                                "
                                onclick="
                                    hozzaad(
                                        '${id}',
                                        50
                                    )
                                "
                            >
                                +50
                            </button>

                        </div>

                    `;

                }


                /* ------------------------------------------------
                   EGYEDI ÉRTÉK
                   ------------------------------------------------ */

                const egyediBoxHtml = `

                    <div class="custom-add-box">

                        <input
                            id="custom_${id}"
                            type="number"
                            min="1"
                            step="1"
                            inputmode="numeric"
                            placeholder="Egyedi érték"
                            onkeydown="
                                handleEnter(
                                    event,
                                    '${id}'
                                )
                            "
                        >


                        <button
                            onclick="
                                egyediHozzaad(
                                    '${id}'
                                )
                            "
                        >
                            + Hozzáad
                        </button>

                    </div>

                `;


                /* ------------------------------------------------
                   STOPPER
                   ------------------------------------------------ */

                let stopperHtml = '';


                if (
                    g.type === 'sec'
                ) {

                    const timer =
                        data.timers[id] || {

                            elapsed:
                                0,

                            startedAt:
                                0,

                            running:
                                false

                        };


                    const timerElapsed =
                        getTimerElapsed(
                            data,
                            id
                        );


                    const timerDisplay =
                        formatStopwatchTime(
                            timerElapsed
                        );


                    if (
                        timer.running
                    ) {

                        stopperHtml = `

                            <div
                                class="stopwatch running"
                            >

                                <div
                                    id="
                                        stopwatch_display_${id}
                                    "
                                    class="
                                        stopwatch-display
                                    "
                                >
                                    ${timerDisplay}
                                </div>


                                <div
                                    class="
                                        stopwatch-buttons
                                    "
                                >

                                    <button
                                        class="
                                            stopwatch-pause
                                        "
                                        onclick="
                                            stopperSzünet(
                                                '${id}'
                                            )
                                        "
                                    >
                                        ⏸️ Szünet
                                    </button>


                                    <button
                                        class="
                                            stopwatch-finish
                                        "
                                        onclick="
                                            stopperBefejez(
                                                '${id}'
                                            )
                                        "
                                    >
                                        ⏹️ Befejezés
                                    </button>

                                </div>


                                <p
                                    class="
                                        stopwatch-hint
                                    "
                                >
                                    A stopper fut.
                                    A telefon lezárása
                                    sem állítja meg.
                                </p>

                            </div>

                        `;

                    } else {

                        stopperHtml = `

                            <div
                                class="stopwatch"
                            >

                                <div
                                    id="
                                        stopwatch_display_${id}
                                    "
                                    class="
                                        stopwatch-display
                                    "
                                >
                                    ${timerDisplay}
                                </div>


                                <div
                                    class="
                                        stopwatch-buttons
                                    "
                                >

                                    <button
                                        class="
                                            stopwatch-start
                                        "
                                        onclick="
                                            stopperIndit(
                                                '${id}'
                                            )
                                        "
                                    >
                                        ▶️ Indítás
                                    </button>


                                    ${
                                        timerElapsed > 0
                                            ? `

                                                <button
                                                    class="
                                                        stopwatch-finish
                                                    "
                                                    onclick="
                                                        stopperBefejez(
                                                            '${id}'
                                                        )
                                                    "
                                                >
                                                    ⏹️ Befejezés
                                                </button>


                                                <button
                                                    class="
                                                        stopwatch-reset
                                                    "
                                                    onclick="
                                                        stopperNullaz(
                                                            '${id}'
                                                        )
                                                    "
                                                >
                                                    ↺ Nullázás
                                                </button>

                                            `
                                            : ''
                                    }

                                </div>


                                ${
                                    timerElapsed > 0

                                        ? `

                                            <p
                                                class="
                                                    stopwatch-hint
                                                "
                                            >
                                                Szüneteltetett idő:
                                                ez még nincs
                                                hozzáadva
                                                a napi eredményhez.
                                            </p>

                                        `

                                        : `

                                            <p
                                                class="
                                                    stopwatch-hint
                                                "
                                            >
                                                A Befejezés gomb
                                                hozzáadja az időt
                                                a mai eredményhez.
                                            </p>

                                        `
                                }

                            </div>

                        `;

                    }

                }


                /* ------------------------------------------------
                   ELŐZŐ MŰVELET
                   ------------------------------------------------ */

                const undoDisabled =
                    !utolsoMuvelet ||
                    utolsoMuvelet.id !== id ||
                    utolsoMuvelet.date !== today;


                return `

                    <div class="card">

                        <div
                            class="card-header"
                        >

                            <h2
                                class="card-title"
                            >
                                ${g.name}
                            </h2>


                            <div
                                class="target-box"
                            >

                                🎯

                                <input
                                    type="number"
                                    min="1"
                                    value="${goal}"
                                    onchange="
                                        mentiCelt(
                                            '${id}',
                                            this
                                        )
                                    "
                                >

                                ${g.type === 'sec'
                                    ? 'mp'
                                    : 'db'
                                }

                            </div>

                        </div>


                        <div
                            class="val-display"
                            style="
                                color:${g.color};
                            "
                        >
                            ${formatValue(
                                value,
                                g.type
                            )}
                        </div>


                        <div
                            class="
                                progress-wrapper
                            "
                        >

                            <div
                                class="
                                    progress-bar
                                "
                                style="
                                    width:${percent}%;
                                    background:${g.color};
                                "
                            ></div>

                        </div>


                        <div
                            class="
                                progress-text
                            "
                        >

                            ${Math.round(percent)}%

                            ·

                            cél:
                            ${formatGoal(
                                goal,
                                g.type
                            )}

                        </div>


                        ${buttonsHtml}


                        ${egyediBoxHtml}


                        ${stopperHtml}


                        <button
                            class="undo-btn"
                            onclick="
                                visszavon()
                            "
                            ${undoDisabled
                                ? 'disabled'
                                : ''
                            }
                        >
                            ↩️ Utolsó hozzáadás
                            visszavonása
                        </button>


                        <button
                            class="history-btn"
                            onclick="
                                toggleReszletek(
                                    '${id}'
                                )
                            "
                        >
                            📜 Előzmények
                        </button>


                        <div
                            id="
                                history_${id}
                            "
                            class="
                                history-box
                            "
                        >

                            ${recentHtml}


                            <div
                                class="
                                    stats-grid
                                "
                            >

                                <div class="stat">

                                    <span
                                        class="
                                            stat-value
                                        "
                                    >
                                        ${formatValue(
                                            calculateWeeklyTotal(
                                                data,
                                                id
                                            ),
                                            g.type
                                        )}
                                    </span>

                                    <span
                                        class="
                                            stat-label
                                        "
                                    >
                                        elmúlt 7 nap
                                    </span>

                                </div>


                                <div class="stat">

                                    <span
                                        class="
                                            stat-value
                                        "
                                    >
                                        ${formatValue(
                                            calculateRecord(
                                                data,
                                                id
                                            ),
                                            g.type
                                        )}
                                    </span>

                                    <span
                                        class="
                                            stat-label
                                        "
                                    >
                                        rekord
                                    </span>

                                </div>


                                <div class="stat">

                                    <span
                                        class="
                                            stat-value
                                        "
                                    >
                                        ${formatValue(
                                            Math.round(
                                                calculateAverage(
                                                    data,
                                                    id
                                                )
                                            ),
                                            g.type
                                        )}
                                    </span>

                                    <span
                                        class="
                                            stat-label
                                        "
                                    >
                                        átlagos nap
                                    </span>

                                </div>

                            </div>


                            <button
                                class="history-btn"
                                onclick="
                                    nyitTeljesElozmeny()
                                "
                            >
                                📊 Teljes előzmények
                            </button>

                        </div>

                    </div>

                `;

            }).join('');


        initPicker();


        if (
            vanFutoStopper(data)
        ) {

            startStopperFrissites();

        }

    }


    /* ============================================================
       ENTER KEZELÉS
       ============================================================ */

    function handleEnter(
        event,
        id
    ) {

        if (
            event.key === 'Enter'
        ) {

            egyediHozzaad(id);

        }

    }


    /* ============================================================
       ELŐZMÉNYEK
       ============================================================ */

    function toggleReszletek(id) {

        const element =
            document.getElementById(
                'history_' + id
            );


        if (!element) {
            return;
        }


        element.classList.toggle(
            'active'
        );
    }


    function nyitTeljesElozmeny() {

        valtView('history');

        renderFullHistory();
    }


    function renderFullHistory() {

        const data =
            loadData();

        const container =
            document.getElementById(
                'full-history'
            );


        const allDates =
            new Set();


        gyakorlatokDef.forEach(g => {

            const history =
                getHistory(
                    data,
                    g.id
                );


            Object.keys(history)
                .forEach(
                    date =>
                        allDates.add(date)
                );

        });


        const dates =
            Array.from(
                allDates
            )
            .sort()
            .reverse();


        if (
            dates.length === 0
        ) {

            container.innerHTML = `

                <div class="empty">
                    Még nincs rögzített adat.
                </div>

            `;

            return;
        }


        container.innerHTML =
            dates.map(date => {

                const rows =
                    gyakorlatokDef
                        .filter(
                            g =>
                                data.activeExercises[g.id] !== false
                        )
                        .map(g => {

                            const value =
                                getHistory(
                                    data,
                                    g.id
                                )[date] || 0;


                            if (
                                Number(value) <= 0
                            ) {

                                return '';

                            }


                            return `

                                <div
                                    class="
                                        history-row
                                    "
                                >

                                    <span>
                                        ${g.name}
                                    </span>

                                    <strong>
                                        ${formatValue(
                                            value,
                                            g.type
                                        )}
                                    </strong>

                                </div>

                            `;

                        })
                        .join('');


                if (!rows) {
                    return '';
                }


                return `

                    <div
                        class="card"
                        style="
                            margin-bottom:10px;
                        "
                    >

                        <h3
                            style="
                                margin-top:0;
                            "
                        >
                            ${formatDate(date)}
                        </h3>

                        ${rows}

                    </div>

                `;

            }).join('');
    }


    /* ============================================================
       NÉZETVÁLTÁS
       ============================================================ */

    function valtView(view) {

        const main =
            document.getElementById(
                'main-view'
            );

        const history =
            document.getElementById(
                'history-view'
            );


        if (
            view === 'history'
        ) {

            main.classList.remove(
                'active'
            );

            history.classList.add(
                'active'
            );

        } else {

            history.classList.remove(
                'active'
            );

            main.classList.add(
                'active'
            );

        }

    }


    /* ============================================================
       BEÁLLÍTÁSOK
       ============================================================ */

    function toggleSettings() {

        const section =
            document.getElementById(
                'settings-section'
            );


        if (
            section.style.display ===
            'none'
        ) {

            section.style.display =
                'block';

        } else {

            section.style.display =
                'none';

        }

    }


    /* ============================================================
       EXPORT
       ============================================================ */

    function exportData() {

        const data =
            loadData();


        const blob =
            new Blob(
                [
                    JSON.stringify(
                        data,
                        null,
                        2
                    )
                ],
                {
                    type:
                        'application/json'
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const a =
            document.createElement(
                'a'
            );


        a.href =
            url;

        a.download =
            'edzesnaplo-mentes-' +
            getTodayString() +
            '.json';


        document.body.appendChild(a);

        a.click();

        a.remove();


        URL.revokeObjectURL(
            url
        );

    }


    /* ============================================================
       IMPORT
       ============================================================ */

    function triggerImport() {

        const input =
            document.getElementById(
                'import-file'
            );


        input.value =
            '';

        input.click();
    }


    function importData(event) {

        const file =
            event.target.files[0];


        if (!file) {
            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function() {

                try {

                    const parsed =
                        JSON.parse(
                            reader.result
                        );


                    const data =
                        normalizeData(
                            parsed
                        );


                    saveData(data);


                    utolsoMuvelet =
                        null;


                    alert(
                        'Az adatok sikeresen be lettek töltve.'
                    );


                    initPicker();

                    renderApp();


                } catch (error) {

                    console.error(
                        error
                    );


                    alert(
                        'Az importált fájl nem érvényes.'
                    );

                }

            };


        reader.readAsText(
            file
        );
    }


    /* ============================================================
       MAI NAP NULLÁZÁSA
       ============================================================ */

    function resetToday() {

        const confirmed =
            confirm(
                'Biztosan törölni szeretnéd a mai nap eredményeit és a mai stopperidőket?'
            );


        if (!confirmed) {
            return;
        }


        const data =
            loadData();

        const today =
            getTodayString();


        gyakorlatokDef.forEach(g => {

            const history =
                getHistory(
                    data,
                    g.id
                );


            delete history[today];


            /*
             * A mai nap nullázásakor a
             * stoppert is nullázzuk.
             */

            data.timers[g.id] = {

                elapsed:
                    0,

                startedAt:
                    0,

                running:
                    false

            };

        });


        saveData(data);


        utolsoMuvelet =
            null;


        stopStopperFrissites();

        renderApp();

    }


    /* ============================================================
       MINDEN ADAT TÖRLÉSE
       ============================================================ */

    function resetAllData() {

        const confirmed =
            confirm(
                'FIGYELEM!\n\n' +
                'Ez minden eddigi edzésadatot, célt és stoppert töröl.\n\n' +
                'Biztosan folytatod?'
            );


        if (!confirmed) {
            return;
        }


        localStorage.removeItem(
            STORAGE_KEY
        );


        /*
         * Régi formátumú adatok
         * eltávolítása is.
         */

        gyakorlatokDef.forEach(g => {

            localStorage.removeItem(
                'history_' + g.id
            );

            localStorage.removeItem(
                'cel_' + g.id
            );

        });


        for (
            let i = 0;
            i < 365;
            i++
        ) {

            const date =
                new Date();

            date.setDate(
                date.getDate() - i
            );


            const dateString =
                dateToString(date);


            localStorage.removeItem(
                'active_ex_' +
                dateString
            );


            gyakorlatokDef.forEach(g => {

                localStorage.removeItem(
                    'cel_' +
                    g.id +
                    '_' +
                    dateString
                );

            });

        }


        utolsoMuvelet =
            null;


        stopStopperFrissites();


        const data =
            createEmptyData();


        saveData(data);


        initPicker();

        renderApp();

    }


    /* ============================================================
       GRATULÁCIÓ
       ============================================================ */

    function mutatPopup() {

        const popup =
            document.getElementById(
                'congrats-popup'
            );


        popup.style.display =
            'flex';
    }


    function bezarPopup() {

        const popup =
            document.getElementById(
                'congrats-popup'
            );


        popup.style.display =
            'none';
    }


    /* ============================================================
       ÉJFÉLI NAPVÁLTÁS
       ============================================================ */

    setInterval(
        () => {

            const aktualisNap =
                getTodayString();


            if (
                aktualisNap !==
                utolsoIsmertNap
            ) {

                utolsoIsmertNap =
                    aktualisNap;


                utolsoMuvelet =
                    null;


                renderApp();

            }

        },
        30000
    );


    /* ============================================================
       INDÍTÁS
       ============================================================ */

    const indulasiAdat =
        loadData();


    initPicker();

    renderApp();


    /*
     * Ha az oldal újratöltésekor már futott stopper,
     * azonnal folytatjuk a kijelző frissítését.
     */

    if (
        vanFutoStopper(
            indulasiAdat
        )
    ) {

        startStopperFrissites();

    }


    /* ============================================================
       SERVICE WORKER
       ============================================================ */

    if (
        'serviceWorker' in navigator
    ) {

        window.addEventListener(
            'load',
            () => {

                navigator.serviceWorker
                    .register(
                        'sw.js'
                    )
                    .catch(
                        error =>
                            console.warn(
                                'Service Worker hiba:',
                                error
                            )
                    );

            }
        );

    }

</script>

</body>
</html>
