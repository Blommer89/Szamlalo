<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Napi Edzés Napló</title>

    <link rel="manifest" href="manifest.json">

    <meta
        name="theme-color"
        content="#2563eb"
    >

    <meta
        name="description"
        content="Egyszerű napi edzés- és ismétlésszámláló"
    >

    <style>

        :root {
            color-scheme: light;

            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e2e8f0;
            --soft: #f1f5f9;

            --soft-blue: #eff6ff;
            --soft-blue-border: #bfdbfe;

            --danger: #dc2626;
            --success: #16a34a;

            --shadow:
                0 2px 5px rgba(0,0,0,0.04);
        }


        @media (prefers-color-scheme: dark) {

            :root {
                color-scheme: dark;

                --bg: #0f172a;
                --card: #1e293b;
                --text: #f1f5f9;
                --muted: #94a3b8;
                --border: #334155;
                --soft: #273449;

                --soft-blue: #172554;
                --soft-blue-border: #1d4ed8;

                --shadow:
                    0 2px 8px rgba(0,0,0,0.2);
            }

        }


        * {
            box-sizing: border-box;
        }


        body {

            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: var(--bg);
            color: var(--text);

            margin: 0;

            padding: 16px;

            padding-bottom:
                max(
                    24px,
                    env(safe-area-inset-bottom)
                );

            display: flex;
            justify-content: center;

            min-height: 100vh;
        }


        button,
        input,
        select {
            font: inherit;
        }


        button {
            -webkit-tap-highlight-color:
                transparent;
        }


        .container {

            width: 100%;
            max-width: 520px;

            position: relative;
        }


        h1 {

            font-size: 1.45rem;

            text-align: center;

            margin:
                4px 0 20px;
        }


        h2,
        h3 {
            line-height: 1.25;
        }


        .top-actions {

            display: flex;

            gap: 8px;

            margin-bottom: 12px;
        }


        .top-actions button {
            flex: 1;
        }


        .small-btn {

            border:
                1px solid var(--border);

            background:
                var(--card);

            color:
                var(--text);

            padding:
                9px 10px;

            border-radius:
                8px;

            cursor: pointer;

            font-weight: 600;
        }


        .card {

            background:
                var(--card);

            border:
                1px solid var(--border);

            border-radius:
                14px;

            padding:
                16px;

            margin-bottom:
                16px;

            box-shadow:
                var(--shadow);
        }


        .card-header {

            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap: 10px;

            margin-bottom:
                8px;
        }


        .card-title {

            font-size:
                1.1rem;

            font-weight:
                700;

            margin: 0;
        }


        .target-box {

            font-size:
                0.82rem;

            color:
                var(--muted);

            white-space:
                nowrap;
        }


        .target-box input {

            width:
                68px;

            padding:
                5px 4px;

            font-size:
                0.85rem;

            border:
                1px solid var(--border);

            border-radius:
                6px;

            text-align:
                center;

            background:
                var(--card);

            color:
                var(--text);
        }


        .val-display {

            font-size:
                2.25rem;

            font-weight:
                800;

            margin:
                10px 0 12px;
        }


        .progress-wrapper {

            background:
                var(--soft);

            border-radius:
                999px;

            height:
                10px;

            width:
                100%;

            overflow:
                hidden;

            margin-bottom:
                7px;
        }


        .progress-bar {

            height:
                100%;

            border-radius:
                999px;

            transition:
                width 0.3s ease;
        }


        .progress-text {

            font-size:
                0.78rem;

            color:
                var(--muted);

            text-align:
                right;

            margin-bottom:
                10px;
        }


        .btn-group {

            display:
                flex;

            gap:
                7px;

            margin-bottom:
                8px;

            flex-wrap:
                wrap;
        }


        .btn-plus {

            flex:
                1;

            min-width:
                72px;

            min-height:
                44px;

            border:
                none;

            border-radius:
                9px;

            padding:
                10px 6px;

            font-size:
                0.9rem;

            font-weight:
                700;

            color:
                white;

            cursor:
                pointer;

            transition:
                transform 0.05s,
                opacity 0.15s;
        }


        .btn-plus:active {

            transform:
                scale(0.97);

            opacity:
                0.85;
        }


        .undo-btn {

            width:
                100%;

            min-height:
                40px;

            border:
                1px solid var(--border);

            background:
                var(--soft);

            color:
                var(--muted);

            border-radius:
                8px;

            font-size:
                0.85rem;

            font-weight:
                600;

            cursor:
                pointer;

            margin-top:
                6px;
        }


        .undo-btn:disabled {

            opacity:
                0.45;

            cursor:
                default;
        }


        .custom-add-box {

            display:
                flex;

            gap:
                6px;

            margin-top:
                8px;

            align-items:
                center;
        }


        .custom-add-box input {

            min-width:
                0;

            flex:
                1;

            padding:
                9px 6px;

            border:
                1px solid var(--border);

            border-radius:
                7px;

            font-size:
                0.9rem;

            text-align:
                center;

            background:
                var(--card);

            color:
                var(--text);
        }


        .custom-add-box select {

            padding:
                9px 6px;

            border:
                1px solid var(--border);

            border-radius:
                7px;

            font-size:
                0.85rem;

            background:
                var(--card);

            color:
                var(--text);
        }


        .custom-add-box button {

            min-height:
                40px;

            padding:
                8px 12px;

            background:
                #475569;

            color:
                white;

            border:
                none;

            border-radius:
                7px;

            font-weight:
                600;

            cursor:
                pointer;
        }


        .setup-box {

            background:
                var(--soft);

            padding:
                13px;

            border-radius:
                9px;

            margin-bottom:
                12px;

            font-size:
                0.9rem;

            text-align:
                center;
        }


        .setup-box input {

            width:
                80px;

            padding:
                7px;

            text-align:
                center;

            font-size:
                1rem;

            margin-top:
                7px;

            border:
                1px solid var(--border);

            border-radius:
                6px;

            background:
                var(--card);

            color:
                var(--text);
        }


        .setup-box button {

            background:
                #2563eb;

            color:
                white;

            border:
                none;

            padding:
                9px 13px;

            border-radius:
                7px;

            font-weight:
                600;

            cursor:
                pointer;

            margin-top:
                7px;
        }


        .picker-card {

            background:
                var(--soft-blue);

            border-color:
                var(--soft-blue-border);
        }


        .picker-card h3 {

            margin-top:
                0;

            font-size:
                1rem;

            color:
                #1e40af;
        }


        .picker-row {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap:
                8px;

            padding:
                6px 0;

            border-bottom:
                1px solid var(--border);
        }


        .picker-row:last-child {
            border-bottom:
                none;
        }


        .picker-row label {

            flex:
                1;

            cursor:
                pointer;

            min-height:
                40px;

            display:
                flex;

            align-items:
                center;

            gap:
                7px;
        }


        .picker-row input[type="checkbox"] {

            width:
                20px;

            height:
                20px;

            accent-color:
                #2563eb;
        }


        .picker-row button {

            background:
                var(--soft);

            border:
                1px solid var(--border);

            padding:
                7px 9px;

            min-height:
                36px;

            border-radius:
                6px;

            font-size:
                0.75rem;

            cursor:
                pointer;

            color:
                var(--text);

            white-space:
                nowrap;
        }


        .history-btn {

            background:
                var(--soft);

            border:
                1px solid var(--border);

            border-radius:
                7px;

            width:
                100%;

            padding:
                9px;

            margin-top:
                12px;

            font-size:
                0.9rem;

            font-weight:
                600;

            color:
                var(--text);

            cursor:
                pointer;
        }


        .history-box {

            display:
                none;

            margin-top:
                10px;

            padding-top:
                8px;

            border-top:
                1px dashed var(--border);

            font-size:
                0.85rem;
        }


        .history-box.active {
            display:
                block;
        }


        .history-row {

            display:
                flex;

            justify-content:
                space-between;

            gap:
                10px;

            padding:
                7px 0;

            border-bottom:
                1px solid var(--soft);
        }


        .history-row:last-child {
            border-bottom:
                none;
        }


        .view-section {
            display:
                none;
        }


        .view-section.active {
            display:
                block;
        }


        .back-btn {

            background:
                #475569;

            color:
                white;

            border:
                none;

            padding:
                9px 16px;

            border-radius:
                7px;

            font-weight:
                600;

            cursor:
                pointer;

            margin-bottom:
                16px;
        }


        .stats-grid {

            display:
                grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap:
                8px;

            margin-top:
                10px;
        }


        .stat {

            background:
                var(--soft);

            border-radius:
                9px;

            padding:
                10px;

            text-align:
                center;
        }


        .stat-value {

            display:
                block;

            font-size:
                1.15rem;

            font-weight:
                800;
        }


        .stat-label {

            display:
                block;

            color:
                var(--muted);

            font-size:
                0.72rem;

            margin-top:
                3px;
        }


        .streak {

            text-align:
                center;

            font-size:
                0.9rem;

            color:
                var(--muted);

            margin:
                4px 0 0;
        }


        .streak strong {
            color:
                #ea580c;
        }


        .section-title {

            font-size:
                0.95rem;

            margin:
                0 0 8px;
        }


        .settings-actions {

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                8px;
        }


        .settings-actions button {

            min-height:
                42px;

            border:
                1px solid var(--border);

            background:
                var(--soft);

            color:
                var(--text);

            border-radius:
                8px;

            font-weight:
                600;

            cursor:
                pointer;
        }


        .settings-actions .danger {
            color:
                var(--danger);
        }


        .empty {

            text-align:
                center;

            color:
                var(--muted);

            font-size:
                0.9rem;

            padding:
                10px 0;
        }


        .success-message {

            color:
                var(--success);

            font-weight:
                700;
        }


        /* ============================================================
           STOPPER
           ============================================================ */

        .stopwatch {

            margin-top:
                10px;

            padding:
                12px;

            background:
                var(--soft);

            border-radius:
                10px;

            text-align:
                center;
        }


        .stopwatch-display {

            font-size:
                1.7rem;

            font-weight:
                800;

            font-variant-numeric:
                tabular-nums;

            margin-bottom:
                9px;
        }


        .stopwatch.running
        .stopwatch-display {

            color:
                var(--success);
        }


        .stopwatch-buttons {

            display:
                flex;

            gap:
                7px;

            flex-wrap:
                wrap;
        }


        .stopwatch-buttons button {

            flex:
                1;

            min-width:
                90px;

            min-height:
                42px;

            border:
                none;

            border-radius:
                8px;

            color:
                white;

            font-weight:
                700;

            cursor:
                pointer;
        }


        .stopwatch-start {
            background:
                #16a34a;
        }


        .stopwatch-pause {
            background:
                #d97706;
        }


        .stopwatch-finish {
            background:
                #2563eb;
        }


        .stopwatch-reset {
            background:
                #64748b;
        }


        .stopwatch-hint {

            color:
                var(--muted);

            font-size:
                0.72rem;

            margin:
                7px 0 0;
        }


        #congrats-popup {

            display:
                none;

            position:
                fixed;

            inset:
                0;

            background:
                rgba(0,0,0,0.7);

            z-index:
                999;

            justify-content:
                center;

            align-items:
                center;

            padding:
                20px;

            animation:
                fadeIn 0.2s ease;
        }


        .popup-content {

            background:
                var(--card);

            padding:
                20px;

            border-radius:
                20px;

            text-align:
                center;

            max-width:
                350px;

            width:
                100%;

            box-shadow:
                0 15px 35px rgba(0,0,0,0.4);

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;
        }


        .popup-content img {

            width:
                100%;

            height:
                auto;

            object-fit:
                contain;

            border-radius:
                10px;

            margin-bottom:
                15px;
        }


        .popup-content h2 {

            margin:
                0 0 8px;
        }


        .popup-content p {

            margin:
                0 0 15px;

            color:
                var(--muted);
        }


        .popup-content button {

            width:
                100%;

            min-height:
                44px;

            border:
                none;

            border-radius:
                8px;

            background:
                #2563eb;

            color:
                white;

            font-weight:
                700;

            cursor:
                pointer;
        }


        @keyframes fadeIn {

            from {
                opacity:
                    0;
            }

            to {
                opacity:
                    1;
            }
        }


        @media (max-width: 380px) {

            body {
                padding:
                    10px;
            }

            .card {
                padding:
                    13px;
            }

            .btn-plus {
                min-width:
                    65px;
            }

        }

    </style>
</head>


<body>

<div class="container">

    <h1>🏋️ Napi Edzés Napló</h1>


    <div class="top-actions">

        <button
            class="small-btn"
            onclick="exportData()"
        >
            📤 Export
        </button>

        <button
            class="small-btn"
            onclick="triggerImport()"
        >
            📥 Import
        </button>

        <button
            class="small-btn"
            onclick="toggleSettings()"
        >
            ⚙️ Beállítások
        </button>

    </div>


    <!-- ============================================================
         BEÁLLÍTÁSOK
         ============================================================ -->

    <div
        id="settings-section"
        class="card"
        style="display:none;"
    >

        <h3 class="section-title">
            Beállítások
        </h3>


        <div class="settings-actions">

            <button onclick="resetToday()">
                🔄 Mai nap nullázása
            </button>

            <button
                class="danger"
                onclick="resetAllData()"
            >
                🗑️ Minden adat törlése
            </button>

        </div>

        <input
            type="file"
            id="import-file"
            accept=".json,application/json"
            style="display:none"
            onchange="importData(event)"
        >

    </div>


    <!-- ============================================================
         FŐ NÉZET
         ============================================================ -->

    <div
        id="main-view"
        class="view-section active"
    >


        <!-- GYAKORLATVÁLASZTÓ -->

        <div class="card picker-card">

            <h3>
                📝 Mai gyakorlatok
            </h3>

            <div id="picker">
            </div>

        </div>


        <!-- NAPI ÖSSZESÍTŐ -->

        <div
            id="daily-summary"
            class="card"
        >
        </div>


        <!-- GYAKORLATOK -->

        <div id="exercise-list">
        </div>


    </div>


    <!-- ============================================================
         TELJES ELŐZMÉNYEK
         ============================================================ -->

    <div
        id="history-view"
        class="view-section"
    >

        <button
            class="back-btn"
            onclick="valtView('main')"
        >
            ← Vissza
        </button>


        <div class="card">

            <h2>
                📊 Teljes előzmények
            </h2>

            <div id="full-history">
            </div>

        </div>

    </div>


</div>


<!-- ================================================================
     GRATULÁCIÓS POPUP
     ================================================================ -->

<div id="congrats-popup">

    <div class="popup-content">

        <img
            src="ikon_kacsinto.png"
            alt="Gratulálok"
        >

        <h2>
            🎉 Szép munka!
        </h2>

        <p>
            Elérted a mai célodat!
        </p>

        <button
            onclick="bezarPopup()"
        >
            Rendben
        </button>

    </div>

</div>


<script>

    /* ============================================================
       ALAPADATOK
       ============================================================ */

    const STORAGE_KEY =
        'szamlalo_v2';

    const STORAGE_VERSION =
        2;


    const gyakorlatokDef = [

        {
            id: 'fekvo',
            name: 'Fekvőtámasz',
            color: '#2563eb',
            type: 'db',
            defaultGoal: 100
        },

        {
            id: 'felules',
            name: 'Felülés',
            color: '#9333ea',
            type: 'db',
            defaultGoal: 100
        },

        {
            id: 'futas',
            name: 'Futás',
            color: '#4f46e5',
            type: 'sec',
            defaultGoal: 300
        },

        {
            id: 'guggolas',
            name: 'Guggolás',
            color: '#16a34a',
            type: 'db',
            defaultGoal: 100
        },

        {
            id: 'haspres',
            name: 'Hasprés',
            color: '#ea580c',
            type: 'db',
            defaultGoal: 100
        },

        {
            id: 'hulahopp',
            name: 'Hulahopp karika',
            color: '#0891b2',
            type: 'sec',
            defaultGoal: 300
        },

        {
            id: 'kerekpar',
            name: 'Kerékpározás',
            color: '#d97706',
            type: 'sec',
            defaultGoal: 1800
        },

        {
            id: 'labemeles',
            name: 'Lábemelés',
            color: '#dc2626',
            type: 'db',
            defaultGoal: 100
        },

        {
            id: 'plank',
            name: 'Plank',
            color: '#0f766e',
            type: 'sec',
            defaultGoal: 300
        },

        {
            id: 'ugralokotel',
            name: 'Ugrálókötél',
            color: '#db2777',
            type: 'sec',
            defaultGoal: 300
        }

    ];


    let utolsoMuvelet = null;

    let stopperInterval = null;

    let utolsoIsmertNap =
        getTodayString();


    /* ============================================================
       DÁTUM
       ============================================================ */

    function getTodayString() {

        const now =
            new Date();

        const year =
            now.getFullYear();

        const month =
            String(
                now.getMonth() + 1
            ).padStart(2, '0');

        const day =
            String(
                now.getDate()
            ).padStart(2, '0');

        return (
            `${year}-${month}-${day}`
        );
    }


    function dateFromString(str) {

        const parts =
            str.split('-');

        return new Date(
            Number(parts[0]),
            Number(parts[1]) - 1,
            Number(parts[2])
        );
    }


    function formatDate(str) {

        const d =
            dateFromString(str);

        return d.toLocaleDateString(
            'hu-HU',
            {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }
        );
    }


    function dateToString(date) {

        const year =
            date.getFullYear();

        const month =
            String(
                date.getMonth() + 1
            ).padStart(2, '0');

        const day =
            String(
                date.getDate()
            ).padStart(2, '0');

        return (
            `${year}-${month}-${day}`
        );
    }


    /* ============================================================
       FORMÁZÁS
       ============================================================ */

    function formatTime(seconds) {

        seconds =
            Math.max(
                0,
                Math.floor(
                    Number(seconds) || 0
                )
            );

        const hours =
            Math.floor(
                seconds / 3600
            );

        const minutes =
            Math.floor(
                (seconds % 3600) / 60
            );

        const secs =
            seconds % 60;


        if (hours > 0) {

            return (
                `${hours} óra ` +
                `${minutes} perc`
            );

        }


        if (minutes > 0) {

            return (
                `${minutes} perc ` +
                `${secs} mp`
            );

        }


        return `${secs} mp`;
    }


    function formatValue(value, type) {

        value =
            Number(value) || 0;

        if (type === 'sec') {

            return formatTime(value);

        }

        return `${value} db`;
    }


    function formatGoal(goal, type) {

        return formatValue(
            goal,
            type
        );
    }


    function clamp(value, min, max) {

        return Math.min(
            max,
            Math.max(
                min,
                value
            )
        );
    }


    /* ============================================================
       ADATTÁROLÁS
       ============================================================ */

    function createEmptyData() {

        const data = {

            version:
                STORAGE_VERSION,

            activeExercises: {},

            goals: {},

            history: {},

            timers: {},

            lastUpdated:
                new Date().toISOString()

        };


        gyakorlatokDef.forEach(g => {

            data.activeExercises[g.id] =
                true;

            data.goals[g.id] =
                g.defaultGoal;

            data.history[g.id] =
                {};

        });


        return data;
    }


    function saveData(data) {

        data.lastUpdated =
            new Date().toISOString();

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(data)
        );
    }


    function normalizeData(data) {

        const clean =
            createEmptyData();


        if (
            data &&
            typeof data === 'object'
        ) {

            if (
                data.activeExercises &&
                typeof data.activeExercises === 'object'
            ) {

                Object.assign(
                    clean.activeExercises,
                    data.activeExercises
                );

            }


            if (
                data.goals &&
                typeof data.goals === 'object'
            ) {

                Object.keys(
                    data.goals
                ).forEach(key => {

                    const value =
                        Number(
                            data.goals[key]
                        );

                    if (
                        Number.isFinite(value) &&
                        value > 0
                    ) {

                        clean.goals[key] =
                            value;

                    }

                });

            }


            if (
                data.history &&
                typeof data.history === 'object'
            ) {

                Object.keys(
                    data.history
                ).forEach(id => {

                    if (
                        !data.history[id] ||
                        typeof data.history[id] !== 'object'
                    ) {

                        return;

                    }

                    clean.history[id] =
                        {};

                    Object.keys(
                        data.history[id]
                    ).forEach(date => {

                        const value =
                            Number(
                                data.history[id][date]
                            );

                        if (
                            Number.isFinite(value) &&
                            value >= 0
                        ) {

                            clean.history[id][date] =
                                value;

                        }

                    });

                });

            }


            /* ----------------------------------------------------
               STOPPEREK
               ---------------------------------------------------- */

            if (
                data.timers &&
                typeof data.timers === 'object'
            ) {

                Object.keys(
                    data.timers
                ).forEach(id => {

                    const timer =
                        data.timers[id];

                    if (
                        !timer ||
                        typeof timer !== 'object'
                    ) {

                        return;

                    }


                    const elapsed =
                        Number(
                            timer.elapsed
                        ) || 0;

                    const startedAt =
                        Number(
                            timer.startedAt
                        ) || 0;

                    const running =
                        timer.running === true;


                    clean.timers[id] = {

                        elapsed:
                            Math.max(
                                0,
                                elapsed
                            ),

                        startedAt:
                            running &&
                            startedAt > 0
                                ? startedAt
                                : 0,

                        running

                    };

                });

            }

        }


        return clean;
    }


    function migrateOldData() {

        const existing =
            localStorage.getItem(
                STORAGE_KEY
            );


        if (existing) {

            try {

                return normalizeData(
                    JSON.parse(existing)
                );

            } catch (error) {

                console.warn(
                    'Hibás új adat:',
                    error
                );

            }

        }


        const data =
            createEmptyData();

        let foundOldData =
            false;


        gyakorlatokDef.forEach(g => {

            const oldHistory =
                localStorage.getItem(
                    'history_' + g.id
                );


            if (oldHistory) {

                try {

                    const parsed =
                        JSON.parse(oldHistory);

                    if (
                        parsed &&
                        typeof parsed === 'object'
                    ) {

                        data.history[g.id] =
                            parsed;

                        foundOldData =
                            true;

                    }

                } catch (error) {

                    console.warn(
                        'Régi előzmény hiba:',
                        error
                    );

                }

            }


            const oldGoal =
                localStorage.getItem(
                    'cel_' + g.id
                );


            if (oldGoal !== null) {

                const goal =
                    Number(oldGoal);

                if (
                    Number.isFinite(goal) &&
                    goal > 0
                ) {

                    data.goals[g.id] =
                        goal;

                    foundOldData =
                        true;

                }

            }

        });


        const today =
            getTodayString();


        for (
            let i = 0;
            i < 365;
            i++
        ) {

            const date =
                new Date();

            date.setDate(
                date.getDate() - i
            );

            const dateString =
                dateToString(date);


            const active =
                localStorage.getItem(
                    'active_ex_' +
                    dateString
                );


            if (active) {

                try {

                    const parsed =
                        JSON.parse(active);

                    if (
                        parsed &&
                        typeof parsed === 'object'
                    ) {

                        Object.keys(parsed)
                            .forEach(id => {

                                if (
                                    parsed[id] === true
                                ) {

                                    data.activeExercises[id] =
                                        true;

                                }

                            });

                        foundOldData =
                            true;

                    }

                } catch (error) {

                    console.warn(
                        'Régi aktív gyakorlat hiba:',
                        error
                    );

                }

            }


            gyakorlatokDef.forEach(g => {

                const oldGoal =
                    localStorage.getItem(
                        'cel_' +
                        g.id +
                        '_' +
                        dateString
                    );


                if (
                    oldGoal !== null
                ) {

                    const goal =
                        Number(oldGoal);

                    if (
                        Number.isFinite(goal) &&
                        goal > 0
                    ) {

                        data.goals[
                            g.id + '_' +
                            dateString
                        ] = goal;

                        foundOldData =
                            true;

                    }

                }

            });

        }


        if (foundOldData) {

            saveData(data);

        }


        return data;
    }


    function loadData() {

        const data =
            migrateOldData();

        return normalizeData(data);
    }


    /* ============================================================
       GYAKORLATOK
       ============================================================ */

    function getActiveExercises(data) {

        return gyakorlatokDef.filter(
            g =>
                data.activeExercises[g.id] !== false
        );
    }


    function getGoal(
        data,
        id,
        date
    ) {

        const specific =
            data.goals[
                id + '_' + date
            ];


        if (
            Number.isFinite(
                Number(specific)
            ) &&
            Number(specific) > 0
        ) {

            return Number(specific);

        }


        return (
            Number(data.goals[id]) ||
            gyakorlatokDef.find(
                g => g.id === id
            )?.defaultGoal ||
            1
        );
    }


    function getHistory(
        data,
        id
    ) {

        if (
            !data.history[id]
        ) {

            data.history[id] =
                {};

        }

        return data.history[id];
    }


    function getTodayValue(
        data,
        id
    ) {

        const history =
            getHistory(
                data,
                id
            );

        return (
            Number(
                history[getTodayString()]
            ) || 0
        );
    }


    /* ============================================================
       PICKER
       ============================================================ */

        const picker =

                'picker'
            );

    function toggleExercise(
        id,
        active
    ) {

        const data =
            loadData();

        data.activeExercises[id] =
            active;

        saveData(data);

        renderApp();
